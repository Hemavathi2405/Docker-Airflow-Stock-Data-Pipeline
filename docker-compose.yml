version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stocks_user
      POSTGRES_PASSWORD: stocks_password
      POSTGRES_DB: stocks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  airflow:
    build: .
    container_name: stock-pipeline-airflow
    command: ["bash", "/opt/airflow/start.sh"]
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/start.sh:/opt/airflow/start.sh
    ports:
      - "8080:8080"
    restart: always

  scheduler:
    build: .
    depends_on:
      - postgres
      - airflow
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: ["bash", "-c", "airflow scheduler"]
    restart: always

volumes:
  postgres_data:
